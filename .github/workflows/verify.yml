name: Verify TravelMate
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      # 自動檢查後端邏輯、前端操作與模組載入；不使用任何正式 API 金鑰。
      - run: python -m compileall -q frontend agents services tools api
      - run: python -m pytest -q
